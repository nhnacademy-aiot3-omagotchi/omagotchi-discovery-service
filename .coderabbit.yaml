# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review policy for the Eureka service registry.

language: "ko-KR"
tone_instructions: >
  문제를 지적할 때 원인과 영향 범위를 설명하고, 필요하면 공식 문서나 근거를 함께 제안해주세요.
  단, 추측만으로 변경을 요구하지 말고 실제 요청 흐름과 테스트를 근거로 판단해주세요.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: false
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  enable_prompt_for_ai_agents: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: "무엇을 왜 바꿨는지 드러내세요. 예: fix(discovery): Eureka 등록 설정을 운영 환경에 맞춤"

  auto_review:
    enabled: false
    labels: ["review-ready"]
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 2
    ignore_title_keywords: ["WIP", "wip", "[skip review]"]

  path_filters:
    - "!**/target/**"
    - "!**/.mvn/**"
    - "!mvnw"
    - "!mvnw.cmd"
    - "!**/generated/**"
    - "!**/*.lock"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        이 서비스는 Eureka 서비스 레지스트리입니다. 업무 API나 인증·인가 정책을 이 서비스에 추가하는 변경을 지적해주세요.
        Registry 가용성, 상태 확인, 운영 진단에 필요한 최소 책임을 넘는 기능 확장을 경계해주세요.

    - path: "**/src/main/resources/application*.{yml,yaml,properties}"
      instructions: |
        Eureka server/client 설정, self-registration, 보안되지 않은 Registry·Actuator 노출, 환경별 URL과 포트가 일관적인지 검토해주세요.
        평문 Secret·Key·Token과 운영 기본값이 local 개발 설정에 의존하는 문제를 지적해주세요.

    - path: "**/src/test/**"
      instructions: |
        설정 변경은 Spring Boot 기동, Eureka Registry 동작, Health Endpoint 영향을 검증하는 테스트가 있는지 확인해주세요.
        Assertion 없는 테스트와 실행 순서에 의존하는 테스트를 지적해주세요.

    - path: "**/pom.xml"
      instructions: |
        Java 21, Spring Boot 4.1.0, Spring Cloud 2025.1.2 BOM을 확인해주세요.
        Spring이 관리하는 의존성에 개별 version을 지정하거나 production dependency를 불필요하게 추가하면 지적해주세요.

    - path: ".github/workflows/**"
      instructions: |
        Secret 노출, pull_request_target 오용, 태그로만 고정된 third-party Action, 과도한 GITHUB_TOKEN 권한을 지적해주세요.

chat:
  auto_reply: false

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/**/*.md"
      - "README.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
