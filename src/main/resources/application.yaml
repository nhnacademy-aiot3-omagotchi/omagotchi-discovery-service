server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    # Rule Engine의 초기 역할 판정 전에 최신 Registry 응답 제공
    # 서버의 별도 Read-only Cache 지연 제거. Client Registry Fetch 지연은 별도 존재
    use-read-only-response-cache: false

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 개발 환경 텍스트 로그의 Request ID·Trace ID·Span ID 표시 형식
    correlation: "[requestId=%X{http.request.id:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] "
  structured:
    json:
      # ECS 필드와 중복되는 Micrometer MDC 원본 이름 제외
      exclude:
        - traceId
        - spanId
