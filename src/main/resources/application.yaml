server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    # Rule Engine의 초기 역할 판정 전에 최신 Registry 응답 제공
    # 서버의 별도 Read-only Cache 지연 제거. Client Registry Fetch 지연은 별도 존재
    use-read-only-response-cache: false

management:
  # Trace 전파 유지, Collector 전송은 운영 환경에서만 활성화
  opentelemetry:
    tracing:
      export:
        max-queue-size: 1024
        max-batch-size: 128
        schedule-delay: 5s
        timeout: 3s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 2s
      limits:
        max-attributes: 32
        max-attribute-value-length: 256
        max-events: 8
  metrics:
    distribution:
      # p95 집계용 고정 Bucket, Route·상태 조합별 Series 증가량 제한
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s,60s
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # 개발 환경 텍스트 로그의 Request ID·Trace ID·Span ID 표시 형식
    correlation: "[requestId=%X{http.request.id:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] "
  structured:
    json:
      # ECS 필드와 중복되는 Micrometer MDC 원본 이름 제외
      exclude:
        - traceId
        - spanId
