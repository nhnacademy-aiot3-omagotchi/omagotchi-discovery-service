server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    # Rule Engine의 초기 역할 판정 전에 최신 Registry 응답 제공
    # 서버의 별도 Read-only Cache 지연 제거. Client Registry Fetch 지연은 별도 존재
    use-read-only-response-cache: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
